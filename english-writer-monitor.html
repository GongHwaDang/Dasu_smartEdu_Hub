<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>김천다수초 영어 쓰기 학습터 — 선생님 모니터</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;}
.header{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.header h1{color:#fff;font-size:1.2rem;font-weight:900;text-shadow:1px 1px 4px rgba(0,0,0,.3);}
.header .badge{background:rgba(255,255,255,.25);color:#fff;padding:5px 14px;border-radius:20px;font-size:.82rem;font-weight:800;}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px;}
.card{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.lb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.lb-title{font-size:1.3rem;font-weight:900;color:#764ba2;}
.lb-actions{display:flex;gap:8px;}
.lb-btn{padding:7px 16px;border-radius:20px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;transition:all .2s;}
.lb-refresh{border:2px solid #27ae60;background:#fff;color:#27ae60;}
.lb-refresh:hover{background:#27ae60;color:#fff;}
.lb-reset{border:2px solid #e74c3c;background:#fff;color:#e74c3c;}
.lb-reset:hover{background:#e74c3c;color:#fff;}
.lb-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.lb-filter button{padding:6px 12px;border:2px solid #667eea;border-radius:20px;background:#fff;font-family:'Nunito',sans-serif;font-size:.76rem;font-weight:800;color:#667eea;cursor:pointer;transition:all .2s;}
.lb-filter button.active{background:#667eea;color:#fff;}
.lb-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.stat-box{flex:1;min-width:100px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:14px;padding:12px;text-align:center;color:#fff;}
.stat-box .sv{font-size:1.8rem;font-weight:900;}
.stat-box .sk{font-size:.75rem;font-weight:700;opacity:.9;}
.lb-table{width:100%;border-collapse:collapse;font-size:.85rem;}
.lb-table th{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:10px 8px;text-align:center;}
.lb-table th:first-child{border-radius:12px 0 0 0;}
.lb-table th:last-child{border-radius:0 12px 0 0;}
.lb-table td{padding:10px 8px;text-align:center;border-bottom:1px solid #f0f0f0;font-weight:700;}
.lb-table tr:nth-child(even) td{background:#f9f6ff;}
.lb-table tr.gold td{background:#FFFDE7;}
.lb-table tr.silver td{background:#F5F5F5;}
.lb-table tr.bronze td{background:#FFF3E0;}
.lb-empty{text-align:center;color:#bbb;padding:30px;font-weight:700;}
.fb-notice{background:#FFF3E0;border:2px solid #FF9800;border-radius:12px;padding:12px;margin-bottom:14px;font-size:.82rem;font-weight:700;color:#e65100;line-height:1.6;text-align:center;}
.auto-badge{background:#E8F5E9;border:2px solid #4CAF50;border-radius:10px;padding:6px 12px;font-size:.78rem;font-weight:800;color:#27ae60;display:inline-block;margin-bottom:12px;}
.madeby{text-align:center;margin-top:16px;font-size:.9rem;color:rgba(255,255,255,.6);font-weight:800;}
</style>
</head>
<body>
<div class="header">
  <h1>🏫 김천다수초등학교 영어 쓰기 학습터</h1>
  <div class="badge">👩‍🏫 선생님 모니터</div>
</div>

<div class="wrap">
  <div class="card">
    <div class="fb-notice" id="fbNotice">⚠️ Firebase 설정을 완료하면 실시간 학생 기록을 확인할 수 있어요!</div>
    <div class="auto-badge" id="autoBadge" style="display:none">🔄 30초마다 자동 새로고침</div>
    <div class="lb-top">
      <div class="lb-title">📊 학생 순위표</div>
      <div class="lb-actions">
        <button class="lb-btn lb-refresh" onclick="refreshAll()">🔄 새로고침</button>
        <button class="lb-btn lb-reset" onclick="resetAll()">🗑️ 전체 초기화</button>
      </div>
    </div>
    <div class="lb-stats">
      <div class="stat-box"><div class="sv" id="statTotal">0</div><div class="sk">총 기록 수</div></div>
      <div class="stat-box"><div class="sv" id="statStudents">0</div><div class="sk">참여 학생</div></div>
      <div class="stat-box"><div class="sv" id="statBest">-</div><div class="sk">최고 기록</div></div>
    </div>
    <div class="lb-filter" id="lbFilter">
      <button class="active" onclick="flt(event,'all')">전체</button>
      <button onclick="flt(event,'0')">🌱 매우쉬움</button>
      <button onclick="flt(event,'1')">🌿 쉬움</button>
      <button onclick="flt(event,'2')">🌟 보통</button>
      <button onclick="flt(event,'3')">🔥 어려움</button>
      <button onclick="flt(event,'4')">💀 매우어려움</button>
    </div>
    <div id="lbContent"><div class="lb-empty">⏳ 불러오는 중...</div></div>
  </div>
  <div class="madeby">✏️ Made by 강경진</div>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyD6zdn7bxWDiEBomNAIHSHK2Hl_ECTieeM",
  authDomain:"english-writing-733b3.firebaseapp.com",
  databaseURL:"https://english-writing-733b3-default-rtdb.firebaseio.com",
  projectId:"english-writing-733b3",
  storageBucket:"english-writing-733b3.firebasestorage.app",
  messagingSenderId:"1091535793177",
  appId:"1:1091535793177:web:82d2505e73d0387eed0e88"
};
let db=null,fbReady=false;
try{
  if(!firebaseConfig.databaseURL.includes("여기에")){
    firebase.initializeApp(firebaseConfig);
    db=firebase.database();fbReady=true;
    document.getElementById('fbNotice').style.display='none';
    document.getElementById('autoBadge').style.display='inline-block';
  }
}catch(e){console.warn("Firebase:",e);}

var curFilter='all';
var allRecs=[];
var DNAMES=['🌱 매우쉬움','🌿 쉬움','🌟 보통','🔥 어려움','💀 매우어려움'];
var MEDALS=['🥇','🥈','🥉'],RCL=['gold','silver','bronze'];

function loadAll(){
  var el=document.getElementById('lbContent');
  el.innerHTML='<div class="lb-empty">⏳ 불러오는 중...</div>';
  if(fbReady&&db){
    db.ref('writing_lb').once('value').then(function(snap){
      var raw=snap.val()||{};
      allRecs=[];
      Object.values(raw).forEach(function(d){
        if(typeof d==='object') Object.values(d).forEach(function(r){allRecs.push(r);});
      });
      updateStats(allRecs);
      renderFiltered();
    }).catch(function(){el.innerHTML='<div class="lb-empty">❌ 불러오기 실패</div>';});
  }else{
    var stored=JSON.parse(localStorage.getItem('wr_lb')||'{}');
    allRecs=Object.values(stored);
    updateStats(allRecs);
    renderFiltered();
  }
}

function updateStats(records){
  document.getElementById('statTotal').textContent=records.length;
  var names=new Set(records.map(function(r){return r.name;}));
  document.getElementById('statStudents').textContent=names.size;
  if(records.length){
    var best=records.slice().sort(function(a,b){
      if(a.diffIdx!==b.diffIdx)return b.diffIdx-a.diffIdx;
      return a.elapsed-b.elapsed;
    })[0];
    document.getElementById('statBest').textContent=best.name+'('+best.elapsed+'초)';
  }else{
    document.getElementById('statBest').textContent='-';
  }
}

function renderFiltered(){
  var rec=curFilter==='all'?allRecs:allRecs.filter(function(r){return String(r.diffIdx)===curFilter;});
  rec=rec.slice().sort(function(a,b){return a.diffIdx!==b.diffIdx?b.diffIdx-a.diffIdx:a.elapsed-b.elapsed;});
  var el=document.getElementById('lbContent');
  if(!rec.length){el.innerHTML='<div class="lb-empty">아직 기록이 없어요!</div>';return;}
  var h='<table class="lb-table"><thead><tr><th>순위</th><th>별명</th><th>난이도</th><th>완료시간</th><th>학습범위</th><th>날짜</th></tr></thead><tbody>';
  rec.slice(0,50).forEach(function(r,i){
    var rank=i<3?MEDALS[i]:(i+1);var rc=i<3?RCL[i]:'';
    h+='<tr class="'+rc+'"><td>'+rank+'</td><td><b>'+r.name+'</b></td><td style="font-size:.76rem">'+DNAMES[r.diffIdx]+'</td><td><b style="color:#764ba2">'+r.elapsed+'초</b></td><td style="font-size:.76rem;color:#888">'+(r.range||'-')+'</td><td style="font-size:.72rem;color:#aaa">'+(r.date||'-')+'</td></tr>';
  });
  h+='</tbody></table>';el.innerHTML=h;
}

function flt(e,f){
  curFilter=f;
  document.querySelectorAll('#lbFilter button').forEach(function(b){b.classList.remove('active');});
  e.target.classList.add('active');
  renderFiltered();
}
function refreshAll(){loadAll();}
function resetAll(){
  if(!confirm('정말로 모든 학생 기록을 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.'))return;
  if(fbReady&&db){
    db.ref('writing_lb').remove().then(function(){allRecs=[];updateStats([]);renderFiltered();alert('초기화 완료!');});
  }else{
    localStorage.removeItem('wr_lb');allRecs=[];updateStats([]);renderFiltered();alert('초기화 완료!');
  }
}

// auto refresh
loadAll();
if(fbReady) setInterval(loadAll,30000);
</script>
</body>
</html>
