<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>제2외국어 단어 학습</title>
<style>
  :root{
    --bg:#f6f7fb;
    --surface:#ffffff;
    --line:#e7e9f0;
    --text:#20232b;
    --sub:#7c8091;
    --accent:#3b5bfd;
    --accent-soft:#eef1ff;
    --good:#1a9c6b;
    --good-soft:#e5f8f0;
    --bad:#e4483a;
    --bad-soft:#fdeceb;
    --radius:16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html.dark{
    --bg:#15171e;
    --surface:#1e212b;
    --line:#2c3040;
    --text:#eef0f5;
    --sub:#9296a8;
    --accent:#6f87ff;
    --accent-soft:#262b45;
    --good:#37c58a;
    --good-soft:#173229;
    --bad:#ff6b5e;
    --bad-soft:#3a1f1d;
  }
  html.dark .mcard{ color:#0d0f16; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{
    /* 기기 화면 폭에 맞춰 전체 UI 스케일을 자동 보정 (작은 폰 ~ 폴더블/큰 화면 모두 대응) */
    font-size: clamp(14px, 3.8vw, 19px);
    height:100%;
  }
  body{
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:520px; min-height:100dvh;
    display:flex; flex-direction:column; position:relative;
    background:var(--bg);
  }

  header{
    position:sticky; top:0; z-index:20;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
  }
  header .title{font-size:1.02rem; font-weight:700;}
  header .lang-badge{
    font-size:.72rem; font-weight:700; color:var(--accent); background:var(--accent-soft);
    padding:5px 10px; border-radius:999px;
  }
  header .header-right{display:flex; align-items:center; gap:8px;}
  .theme-toggle{
    display:flex; align-items:center; gap:2px; background:var(--bg); border:1px solid var(--line);
    border-radius:999px; padding:3px;
  }
  .theme-toggle .t-opt{
    width:28px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:999px;
    font-size:.82rem; color:var(--sub); cursor:pointer;
  }
  .theme-toggle .t-opt.active{ background:var(--accent); color:#fff; }

  main{flex:1; padding:16px 16px calc(88px + var(--safe-b)); overflow-y:auto;}
  .panel{display:none; flex-direction:column; gap:14px;}
  .panel.active{display:flex;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px;
  }
  .section-label{font-size:.78rem; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
  .empty{color:var(--sub); text-align:center; padding:56px 12px; font-size:.92rem; line-height:1.6;}

  /* ---- inputs ---- */
  label{font-size:.8rem; font-weight:600; color:var(--sub); display:block; margin-bottom:6px;}
  input[type=text], select, textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 13px;
    font-size:.95rem; font-family:inherit; outline:none; background:var(--bg); color:var(--text);
    transition:border-color .15s;
  }
  input[type=text]:focus, select:focus, textarea:focus{border-color:var(--accent); background:var(--surface);}
  textarea{resize:vertical; min-height:96px; line-height:1.5;}

  button{
    border:none; cursor:pointer; font-family:inherit; font-weight:700; border-radius:12px;
    font-size:.9rem; transition:opacity .15s, transform .1s;
  }
  button:active{transform:scale(.97);}
  .btn-primary{background:var(--accent); color:#fff; padding:12px 16px;}
  .btn-primary:disabled{opacity:.4;}
  .btn-ghost{background:var(--accent-soft); color:var(--accent); padding:12px 16px;}
  .btn-line{background:var(--surface); border:1.5px solid var(--line); color:var(--sub); padding:10px 14px;}
  .btn-danger-text{background:none; color:var(--bad); padding:6px 8px; font-size:.82rem;}
  .row{display:flex; gap:8px;}
  .row.wrap{flex-wrap:wrap;}
  .row > *{flex:1;}

  .mode-toggle{display:flex; background:var(--bg); border-radius:12px; padding:3px; margin-bottom:12px;}
  .mode-toggle .opt{flex:1; text-align:center; padding:9px 4px; font-size:.85rem; font-weight:700; color:var(--sub); border-radius:9px; cursor:pointer;}
  .mode-toggle .opt.active{background:var(--surface); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.08);}

  .word-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:var(--bg); margin-top:8px;
  }
  .word-item .w{font-weight:700; font-size:.95rem;}
  .word-item .m{color:var(--sub); font-size:.82rem; margin-top:1px;}
  .word-item .del{color:var(--bad); font-size:1.05rem; padding:6px 8px; line-height:1;}
  .word-count{font-size:.82rem; color:var(--sub); margin-top:2px;}

  /* ---- bottom nav ---- */
  nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:520px; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(6px + var(--safe-b)); z-index:30;
  }
  nav .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:7px 2px; border-radius:10px; color:var(--sub); font-size:.66rem; font-weight:700;
  }
  nav .tab .ic{font-size:1.15rem;}
  nav .tab.active{color:var(--accent);}

  /* ---- flashcard / tts card (공통 큰 카드) ---- */
  .flash-wrap{
    perspective:1400px; width:min(94vw, 460px);
    aspect-ratio:9/11; max-height:56vh;
    margin:10px auto 10px;
  }
  .flash{width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.8,.2,1); cursor:pointer;}
  .flash.flip{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:22px;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    padding:22px; text-align:center; border:1px solid var(--line);
  }
  .front{background:var(--accent); color:#fff; border:none;}
  .back{background:var(--surface); color:var(--text); transform:rotateY(180deg);}
  .face .word{font-size:2.5rem; font-weight:800; word-break:break-word; line-height:1.25;}
  .face .tag{font-size:.95rem; opacity:.85; font-weight:600;}
  .progress-text{text-align:center; font-size:.9rem; color:var(--sub); font-weight:700;}
  .nav-row{display:flex; gap:16px; justify-content:center; align-items:center; margin-top:8px;}
  .circle-btn{width:54px; height:54px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:1.35rem; color:var(--text); flex-shrink:0;}
  .card-speak-btn{
    position:absolute; top:14px; right:14px; width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,.22); color:inherit; display:flex; align-items:center; justify-content:center;
    font-size:1.15rem; z-index:2;
  }
  .back .card-speak-btn{background:var(--accent-soft); color:var(--accent);}
  .card-speak-btn.playing{background:var(--good); color:#fff;}

  /* ---- blank fill (letter tiles) ---- */
  .quiz-meaning{color:var(--sub); font-size:.85rem; font-weight:600; text-align:center;}
  .quiz-lang{font-size:.72rem; color:var(--accent); text-align:center; font-weight:700; margin-bottom:2px;}
  .letter-boxes{display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin:14px 0 18px;}
  .lbox{
    width:34px; height:42px; border-radius:9px; border:2px solid var(--line); background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:1.05rem; font-weight:800;
  }
  .lbox.fixed{background:var(--accent-soft); border-color:var(--accent-soft); color:var(--text);}
  .lbox.filled{border-color:var(--accent); background:var(--surface); color:var(--accent);}
  .lbox.active-slot{border-color:var(--accent); border-style:dashed;}
  .tile-bank{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .tile{
    width:42px; height:42px; border-radius:10px; background:var(--surface); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:1.05rem; font-weight:800; color:var(--text);
  }
  .tile.used{opacity:0; pointer-events:none;}
  .feedback{text-align:center; font-weight:700; min-height:22px; font-size:.88rem;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .score-badge{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:9px 14px; font-size:.82rem; font-weight:700; color:var(--sub);
  }
  .score-badge b{color:var(--text);}

  /* ---- memory match ---- */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .mcard{
    aspect-ratio:1/1; border-radius:12px; background:var(--accent); border:1px solid var(--accent);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800;
    font-size:.85rem; cursor:pointer; text-align:center; padding:5px; word-break:break-word;
    transition:transform .3s, background .2s;
  }
  .mcard.hidden-face{background:var(--accent-soft); border-color:var(--line); color:transparent;}
  .mcard.hidden-face::after{content:"?"; color:var(--accent); font-size:1.2rem; font-weight:800;}
  .mcard.matched{background:var(--good-soft); border-color:var(--good-soft); color:var(--good); opacity:.75; cursor:default;}
  .mcard.wrong{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

  /* ---- TTS practice (카드형) ---- */
  .tts-face{
    background:linear-gradient(180deg,#3b5bfd,#3049d1); color:#fff;
    border-radius:22px; width:min(94vw, 460px); aspect-ratio:9/11; max-height:56vh; margin:10px auto 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    padding:24px; position:relative; text-align:center;
  }
  .tts-face .word{font-size:2.5rem; font-weight:800; word-break:break-word; line-height:1.25;}
  .tts-face .meaning{font-size:1.05rem; opacity:.9; font-weight:600;}
  .tts-face .big-speak{
    width:78px; height:78px; border-radius:50%; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center; font-size:2rem; margin-top:6px;
  }
  .tts-face .big-speak.playing{background:#fff; color:var(--accent);}
  .rate-row{display:flex; align-items:center; gap:10px; margin-top:4px;}
  .rate-row span{font-size:.78rem; color:var(--sub); font-weight:700; white-space:nowrap;}
  input[type=range]{flex:1; accent-color:var(--accent);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="title" id="headerTitle" onclick="handleTitleTap()" style="cursor:default; user-select:none;">단어 등록</div>
    <div id="eggToast" style="position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px) scale(.85); opacity:0; pointer-events:none; background:linear-gradient(135deg,#3b5bfd,#7c5cff); color:#fff; font-size:.82rem; font-weight:800; padding:12px 20px; border-radius:999px; box-shadow:0 10px 28px rgba(59,91,253,.4); z-index:999; transition:opacity .35s cubic-bezier(.34,1.56,.64,1), transform .35s cubic-bezier(.34,1.56,.64,1); white-space:nowrap; letter-spacing:.2px;">🎉 이 앱은 강경진 선생님이 만들었어요! ✨</div>
    <div class="header-right">
      <div class="lang-badge" id="langBadge">EN</div>
      <div class="theme-toggle" id="themeToggle">
        <div class="t-opt" data-theme="light" title="라이트">☀️</div>
        <div class="t-opt" data-theme="system" title="시스템">🌓</div>
        <div class="t-opt" data-theme="dark" title="다크">🌙</div>
      </div>
    </div>
  </header>

  <main>
    <!-- 단어 등록 -->
    <div class="panel active" id="panel-input">
      <div class="card">
        <div class="section-label">학습 언어</div>
        <select id="langSelect"></select>
      </div>

      <div class="card">
        <div class="mode-toggle">
          <div class="opt active" data-mode="single">한 개씩 입력</div>
          <div class="opt" data-mode="bulk">여러 개 붙여넣기</div>
        </div>

        <div id="singleMode">
          <label>외국어 단어</label>
          <input type="text" id="wordSingle" placeholder="예: bonjour">
          <div style="height:10px;"></div>
          <label>뜻 (한국어)</label>
          <input type="text" id="meaningSingle" placeholder="예: 안녕하세요">
          <div style="height:12px;"></div>
          <button class="btn-primary" style="width:100%;" onclick="addSingleWord()">＋ 단어 추가</button>
        </div>

        <div id="bulkMode" style="display:none;">
          <label>단어, 뜻 형식으로 줄바꿈해서 입력</label>
          <textarea id="wordInput" placeholder="bonjour, 안녕하세요&#10;merci, 감사합니다&#10;chat, 고양이"></textarea>
          <div style="height:10px;"></div>
          <button class="btn-primary" style="width:100%;" onclick="addWords()">＋ 한번에 추가</button>
        </div>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="section-label" style="margin-bottom:0;">등록된 단어</div>
          <div class="word-count" id="wordCountText"></div>
        </div>
        <div id="wordListBox"></div>
      </div>

      <div class="row">
        <button class="btn-ghost" style="width:100%;" onclick="saveCurrentAsBook()">💾 단어장으로 저장</button>
        <button class="btn-line" style="width:100%;" onclick="clearWords()">전체 삭제</button>
      </div>
    </div>

    <!-- 단어장 (저장된 세트 불러오기) -->
    <div class="panel" id="panel-library">
      <div id="libraryArea"></div>
    </div>

    <!-- 발음 연습 (TTS 전용 창, 카드형) -->
    <div class="panel" id="panel-tts">
      <div class="card">
        <div class="section-label">발음 재생 속도</div>
        <div class="rate-row">
          <span>느리게</span>
          <input type="range" id="rateSlider" min="0.5" max="1.3" step="0.1" value="0.85">
          <span>빠르게</span>
        </div>
      </div>
      <div id="ttsArea"></div>
    </div>

    <!-- 카드 학습 -->
    <div class="panel" id="panel-flash">
      <div id="flashArea"></div>
    </div>

    <!-- 빈칸 맞추기 -->
    <div class="panel" id="panel-blank">
      <div id="blankArea"></div>
    </div>

    <!-- 카드 뒤집기 -->
    <div class="panel" id="panel-match">
      <div id="matchArea"></div>
    </div>
  </main>

  <nav>
    <div class="tab active" data-tab="input"><div class="ic">📝</div>단어등록</div>
    <div class="tab" data-tab="tts"><div class="ic">🔊</div>발음연습</div>
    <div class="tab" data-tab="flash"><div class="ic">🔄</div>카드학습</div>
    <div class="tab" data-tab="blank"><div class="ic">✏️</div>빈칸맞추기</div>
    <div class="tab" data-tab="match"><div class="ic">🎴</div>짝맞추기</div>
    <div class="tab" data-tab="library"><div class="ic">📚</div>단어장</div>
  </nav>
</div>

<script>
/* ============ 언어 목록 (보편적으로 학습하는 제2외국어) ============ */
const LANGS = [
  {code:'en-US', label:'영어 (English)', short:'EN'},
  {code:'fr-FR', label:'프랑스어 (Français)', short:'FR'},
  {code:'es-ES', label:'스페인어 (Español)', short:'ES'},
  {code:'de-DE', label:'독일어 (Deutsch)', short:'DE'},
  {code:'zh-CN', label:'중국어 (中文)', short:'ZH'},
  {code:'ja-JP', label:'일본어 (日本語)', short:'JA'},
  {code:'it-IT', label:'이탈리아어 (Italiano)', short:'IT'},
  {code:'ru-RU', label:'러시아어 (Русский)', short:'RU'},
  {code:'pt-PT', label:'포르투갈어 (Português)', short:'PT'},
  {code:'vi-VN', label:'베트남어 (Tiếng Việt)', short:'VI'},
  {code:'ar-SA', label:'아랍어 (العربية)', short:'AR'},
  {code:'hi-IN', label:'힌디어 (हिन्दी)', short:'HI'},
  {code:'nl-NL', label:'네덜란드어 (Nederlands)', short:'NL'},
  {code:'tr-TR', label:'터키어 (Türkçe)', short:'TR'},
  {code:'ko-KR', label:'한국어 (한국어)', short:'KO'},
];

/* ============ 상태 ============ */
let words = JSON.parse(localStorage.getItem('sfl_words') || '[]'); // {word, meaning}
let curLang = localStorage.getItem('sfl_lang') || 'en-US';

function saveWords(){ localStorage.setItem('sfl_words', JSON.stringify(words)); }
function saveLang(){ localStorage.setItem('sfl_lang', curLang); }

/* ============ 언어 선택 초기화 ============ */
const langSelect = document.getElementById('langSelect');
LANGS.forEach(l=>{
  const o = document.createElement('option');
  o.value = l.code; o.textContent = l.label;
  langSelect.appendChild(o);
});
langSelect.value = curLang;
langSelect.addEventListener('change', ()=>{
  curLang = langSelect.value; saveLang(); updateLangBadge();
});
function updateLangBadge(){
  const l = LANGS.find(x=>x.code===curLang);
  document.getElementById('langBadge').textContent = l ? l.short : 'EN';
}
updateLangBadge();

/* ============ 단어 등록 UI ============ */
document.querySelectorAll('.mode-toggle .opt').forEach(opt=>{
  opt.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-toggle .opt').forEach(o=>o.classList.remove('active'));
    opt.classList.add('active');
    const isSingle = opt.dataset.mode==='single';
    document.getElementById('singleMode').style.display = isSingle ? 'block':'none';
    document.getElementById('bulkMode').style.display = isSingle ? 'none':'block';
  });
});

function renderWordList(){
  const box = document.getElementById('wordListBox');
  document.getElementById('wordCountText').textContent = words.length ? `${words.length}개` : '';
  if(words.length===0){ box.innerHTML='<div class="empty">아직 등록된 단어가 없어요.<br>위에서 단어를 추가해보세요 ✏️</div>'; return; }
  box.innerHTML = words.map((w,i)=>`
    <div class="word-item">
      <div><div class="w">${escapeHtml(w.word)}</div><div class="m">${escapeHtml(w.meaning)}</div></div>
      <div class="del" onclick="removeWord(${i})">✕</div>
    </div>`).join('');
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function removeWord(i){ words.splice(i,1); saveWords(); renderWordList(); }
function clearWords(){ if(words.length && confirm('등록된 모든 단어를 삭제할까요?')){ words=[]; saveWords(); renderWordList(); } }

function addSingleWord(){
  const w = document.getElementById('wordSingle').value.trim();
  const m = document.getElementById('meaningSingle').value.trim();
  if(!w || !m){ alert('단어와 뜻을 모두 입력해주세요.'); return; }
  words.push({word:w, meaning:m});
  document.getElementById('wordSingle').value='';
  document.getElementById('meaningSingle').value='';
  document.getElementById('wordSingle').focus();
  saveWords(); renderWordList();
}
['wordSingle','meaningSingle'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') addSingleWord(); });
});

function addWords(){
  const raw = document.getElementById('wordInput').value.trim();
  if(!raw) return;
  raw.split('\n').forEach(line=>{
    const parts = line.split(',');
    if(parts.length>=2){
      const word = parts[0].trim();
      const meaning = parts.slice(1).join(',').trim();
      if(word && meaning) words.push({word, meaning});
    }
  });
  document.getElementById('wordInput').value='';
  saveWords(); renderWordList();
}

/* ============ 탭 전환 ============ */
const tabTitles = {input:'단어 등록', tts:'발음 연습', flash:'카드 학습', blank:'빈칸 맞추기', match:'짝 맞추기', library:'단어장'};
document.querySelectorAll('nav .tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('nav .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+t.dataset.tab).classList.add('active');
    document.getElementById('headerTitle').textContent = tabTitles[t.dataset.tab];
    stopSpeak();
    if(t.dataset.tab==='tts') renderTTS();
    if(t.dataset.tab==='flash') renderFlash();
    if(t.dataset.tab==='blank') renderBlank();
    if(t.dataset.tab==='match') renderMatch();
    if(t.dataset.tab==='library') renderLibrary();
  });
});

/* ============ 단어장 (저장된 세트 불러오기) ============ */
function getBooks(){ return JSON.parse(localStorage.getItem('sfl_wordbooks') || '[]'); }
function setBooks(list){ localStorage.setItem('sfl_wordbooks', JSON.stringify(list)); }

function saveCurrentAsBook(){
  if(words.length===0){ alert('저장할 단어가 없어요. 먼저 단어를 등록해주세요.'); return; }
  const defaultName = (LANGS.find(l=>l.code===curLang)?.label.split(' ')[0] || '') + ' 단어장';
  const name = prompt('단어장 이름을 입력해주세요.', defaultName);
  if(name===null) return;
  const finalName = name.trim() || defaultName;
  const books = getBooks();
  books.unshift({ name: finalName, lang: curLang, words: JSON.parse(JSON.stringify(words)), savedAt: Date.now() });
  setBooks(books);
  alert(`"${finalName}" 단어장으로 저장했어요 📚`);
}

function renderLibrary(){
  const area = document.getElementById('libraryArea');
  const books = getBooks();
  if(books.length===0){
    area.innerHTML = `<div class="card"><div class="empty">아직 저장된 단어장이 없어요.<br>"단어등록" 탭에서 단어를 만든 뒤<br>💾 단어장으로 저장해보세요.</div></div>`;
    return;
  }
  area.innerHTML = books.map((b,i)=>{
    const langInfo = LANGS.find(l=>l.code===b.lang);
    const d = new Date(b.savedAt);
    const dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    return `
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <div>
          <div style="font-weight:800; font-size:1rem;">${escapeHtml(b.name)}</div>
          <div style="color:var(--sub); font-size:.78rem; margin-top:3px;">${langInfo?langInfo.short:'?'} · 단어 ${b.words.length}개 · ${dateStr}</div>
        </div>
        <div class="del" style="cursor:pointer; color:var(--bad); font-size:1.05rem;" onclick="deleteBook(${i})">✕</div>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn-primary" style="width:100%;" onclick="loadBook(${i})">📥 불러와서 복습하기</button>
      </div>
    </div>`;
  }).join('');
}

function loadBook(i){
  const books = getBooks();
  const b = books[i];
  if(!b) return;
  if(words.length>0){
    const ok = confirm(`"${b.name}" 단어장을 불러오면 현재 등록된 단어 목록이 교체돼요. 계속할까요?`);
    if(!ok) return;
  }
  words = JSON.parse(JSON.stringify(b.words));
  curLang = b.lang;
  langSelect.value = curLang;
  saveWords(); saveLang(); updateLangBadge(); renderWordList();
  alert(`"${b.name}" 단어장을 불러왔어요. 이제 학습을 시작해보세요!`);
}

function deleteBook(i){
  const books = getBooks();
  if(!confirm(`"${books[i].name}" 단어장을 삭제할까요?`)) return;
  books.splice(i,1);
  setBooks(books);
  renderLibrary();
}

/* ============ TTS (발음 연습 전용 창) ============ */
function stopSpeak(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.playing').forEach(b=>b.classList.remove('playing'));
}
function getRate(){
  const el = document.getElementById('rateSlider');
  const v = el ? parseFloat(el.value) : NaN;
  return isNaN(v) ? 0.85 : v;
}
function speakWord(text, btn){
  if(!('speechSynthesis' in window)){ alert('이 브라우저는 음성 재생을 지원하지 않아요.'); return; }
  try{
    stopSpeak();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = curLang;
    u.rate = getRate();
    const voices = speechSynthesis.getVoices();
    const match = voices.find(v=>v.lang===curLang) || voices.find(v=>v.lang.startsWith(curLang.split('-')[0]));
    if(match) u.voice = match;
    if(btn) btn.classList.add('playing');
    u.onend = ()=>{ if(btn) btn.classList.remove('playing'); };
    u.onerror = ()=>{ if(btn) btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  }catch(e){ console.error('TTS error', e); }
}
let ttsIdx = 0;
function renderTTS(){
  const area = document.getElementById('ttsArea');
  if(words.length===0){ area.innerHTML='<div class="card"><div class="empty">먼저 "단어등록" 탭에서 단어를 추가해주세요 📝</div></div>'; return; }
  if(ttsIdx>=words.length) ttsIdx=0;
  const w = words[ttsIdx];
  area.innerHTML = `
    <div class="progress-text">${ttsIdx+1} / ${words.length}</div>
    <div class="tts-face">
      <div class="word">${escapeHtml(w.word)}</div>
      <div class="meaning">${escapeHtml(w.meaning)}</div>
      <div class="big-speak" id="ttsBigBtn" data-word="${escapeHtml(w.word)}">🔊</div>
    </div>
    <div class="nav-row">
      <div class="circle-btn" id="ttsPrevBtn">◀</div>
      <div class="circle-btn" id="ttsReplayBtn" data-word="${escapeHtml(w.word)}">🔁</div>
      <div class="circle-btn" id="ttsNextBtn">▶</div>
    </div>
  `;
  document.getElementById('ttsBigBtn').addEventListener('click', function(){ speakWord(w.word, this); });
  document.getElementById('ttsReplayBtn').addEventListener('click', function(){ speakWord(w.word, document.getElementById('ttsBigBtn')); });
  document.getElementById('ttsPrevBtn').addEventListener('click', ()=>ttsMove(-1));
  document.getElementById('ttsNextBtn').addEventListener('click', ()=>ttsMove(1));
  speakWord(w.word, document.getElementById('ttsBigBtn'));
}
function ttsMove(dir){ stopSpeak(); ttsIdx=(ttsIdx+dir+words.length)%words.length; renderTTS(); }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = ()=>{}; }

/* ============ 카드 학습 ============ */
let flashIdx = 0, flashFlipped=false;
function renderFlash(){
  const area = document.getElementById('flashArea');
  if(words.length===0){ area.innerHTML='<div class="card"><div class="empty">먼저 "단어등록" 탭에서 단어를 추가해주세요 📝</div></div>'; return; }
  if(flashIdx>=words.length) flashIdx=0;
  const w = words[flashIdx];
  area.innerHTML = `
    <div class="progress-text">${flashIdx+1} / ${words.length}</div>
    <div class="flash-wrap"><div class="flash ${flashFlipped?'flip':''}" id="flashCard">
      <div class="face front">
        <div class="card-speak-btn" id="flashSpeakFront">🔊</div>
        <div class="word">${escapeHtml(w.word)}</div><div class="tag">탭하면 뜻이 보여요</div>
      </div>
      <div class="face back">
        <div class="card-speak-btn" id="flashSpeakBack">🔊</div>
        <div class="word">${escapeHtml(w.meaning)}</div><div class="tag">${escapeHtml(w.word)}</div>
      </div>
    </div></div>
    <div class="nav-row">
      <div class="circle-btn" id="flashPrevBtn">◀</div>
      <div class="circle-btn" id="flashFlipBtn">🔄</div>
      <div class="circle-btn" id="flashNextBtn">▶</div>
    </div>
  `;
  document.getElementById('flashCard').addEventListener('click', flashFlip);
  document.getElementById('flashSpeakFront').addEventListener('click', function(e){ e.stopPropagation(); speakWord(w.word, this); });
  document.getElementById('flashSpeakBack').addEventListener('click', function(e){ e.stopPropagation(); speakWord(w.word, this); });
  document.getElementById('flashPrevBtn').addEventListener('click', ()=>flashMove(-1));
  document.getElementById('flashFlipBtn').addEventListener('click', flashFlip);
  document.getElementById('flashNextBtn').addEventListener('click', ()=>flashMove(1));
}
function flashFlip(){
  flashFlipped=!flashFlipped;
  document.getElementById('flashCard').classList.toggle('flip');
  if(flashFlipped){
    const w = words[flashIdx];
    if(w) speakWord(w.word, document.getElementById('flashSpeakBack'));
  } else {
    stopSpeak();
  }
}
function flashMove(dir){ stopSpeak(); flashFlipped=false; flashIdx=(flashIdx+dir+words.length)%words.length; renderFlash(); }

/* ============ 빈칸 맞추기 (글자 타일 방식) ============ */
let blankIdx=0, blankScore=0, blankTotal=0, blankOrder=[];
let curAnswer='', curBlankPositions=[], curFilled=[], curTiles=[];
function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function setupBlankQuestion(w){
  curAnswer = w.word.toLowerCase();
  const letters = curAnswer.split('');
  const eligible = letters.map((c,i)=>({c,i})).filter(o=>/[a-zA-Z가-힣]/.test(o.c));
  const blankCount = Math.max(1, Math.round(eligible.length * 0.5));
  curBlankPositions = shuffleArr(eligible).slice(0, blankCount).map(o=>o.i).sort((a,b)=>a-b);
  curFilled = curBlankPositions.map(()=>null);
  const missingLetters = curBlankPositions.map(i=>letters[i]);
  // distractor letters
  const alphabetPool = 'abcdefghijklmnopqrstuvwxyz'.split('');
  let distractors = [];
  while(distractors.length < Math.min(3, Math.max(0, 6-missingLetters.length))){
    const d = alphabetPool[Math.floor(Math.random()*alphabetPool.length)];
    if(!missingLetters.includes(d)) distractors.push(d);
  }
  curTiles = shuffleArr([...missingLetters, ...distractors]).map((c,idx)=>({c, id:idx, used:false}));
}

function renderBlank(){
  const area = document.getElementById('blankArea');
  if(words.length===0){ area.innerHTML='<div class="card"><div class="empty">먼저 "단어등록" 탭에서 단어를 추가해주세요 📝</div></div>'; return; }
  if(blankOrder.length!==words.length){ blankOrder=shuffleArr([...Array(words.length).keys()]); blankIdx=0; blankScore=0; blankTotal=0; }
  if(blankIdx>=blankOrder.length){
    area.innerHTML = `<div style="min-height:60vh; display:flex; flex-direction:column; justify-content:center;">
      <div class="card" style="text-align:center;">
        <div style="font-size:1.15rem;font-weight:800;">🎉 완료!</div>
        <div style="margin:10px 0; color:var(--sub); font-weight:700;">맞춘 개수 ${blankScore} / ${blankTotal}</div>
        <button class="btn-primary" style="width:100%;" onclick="blankOrder=[];renderBlank();">다시 풀기</button>
      </div>
    </div>`;
    return;
  }
  const w = words[blankOrder[blankIdx]];
  if(curAnswer !== w.word || curFilled.every(f=>f===null)===false && document.getElementById('blankBoxes')===null){
    // proceed to init below regardless (simpler: init each new question index)
  }
  if(!area.dataset.builtFor || area.dataset.builtFor !== String(blankIdx)){
    setupBlankQuestion(w);
    area.dataset.builtFor = String(blankIdx);
  }
  const letters = curAnswer.split('');
  const boxesHtml = letters.map((c,i)=>{
    if(curBlankPositions.includes(i)){
      const slot = curBlankPositions.indexOf(i);
      const val = curFilled[slot];
      return `<div class="lbox ${val?'filled':'active-slot'}" onclick="clearSlot(${slot})">${val?val:''}</div>`;
    }
    return `<div class="lbox fixed">${c}</div>`;
  }).join('');
  const tilesHtml = curTiles.map(t=>`<div class="tile ${t.used?'used':''}" onclick="pickTile(${t.id})">${t.c}</div>`).join('');
  area.innerHTML = `
    <div class="score-badge"><span>문제 ${blankIdx+1}/${blankOrder.length}</span><span>맞춘 개수 <b>${blankScore}</b></span></div>
    <div class="card" style="text-align:center;">
      <div class="quiz-lang">${LANGS.find(l=>l.code===curLang)?.label || ''}</div>
      <div class="quiz-meaning">이 뜻을 가진 단어의 빈칸을 채워보세요</div>
      <div style="font-size:1.15rem;font-weight:800;margin-top:4px;">${escapeHtml(w.meaning)}</div>
      <div class="letter-boxes" id="blankBoxes">${boxesHtml}</div>
      <div class="tile-bank">${tilesHtml}</div>
      <div class="feedback" id="blankFeedback"></div>
      <div class="row" style="justify-content:center; gap:10px;">
        <button class="btn-line" style="flex:none; padding:11px 16px;" onclick="resetSlots()">지우기</button>
        <button class="btn-primary" style="flex:none; padding:11px 20px;" onclick="checkBlankTiles()">확인</button>
      </div>
    </div>
  `;
}
function pickTile(id){
  const tile = curTiles.find(t=>t.id===id);
  if(!tile || tile.used) return;
  const emptySlot = curFilled.findIndex(f=>f===null);
  if(emptySlot===-1) return;
  curFilled[emptySlot] = tile.c;
  tile.used = true;
  refreshBlankBoxesOnly();
}
function clearSlot(slot){
  const val = curFilled[slot];
  if(!val) return;
  curFilled[slot] = null;
  const tile = curTiles.find(t=>t.c===val && t.used);
  if(tile) tile.used = false;
  refreshBlankBoxesOnly();
}
function resetSlots(){
  curFilled = curFilled.map(()=>null);
  curTiles.forEach(t=>t.used=false);
  refreshBlankBoxesOnly();
}
function refreshBlankBoxesOnly(){
  const letters = curAnswer.split('');
  document.getElementById('blankBoxes').innerHTML = letters.map((c,i)=>{
    if(curBlankPositions.includes(i)){
      const slot = curBlankPositions.indexOf(i);
      const val = curFilled[slot];
      return `<div class="lbox ${val?'filled':'active-slot'}" onclick="clearSlot(${slot})">${val?val:''}</div>`;
    }
    return `<div class="lbox fixed">${c}</div>`;
  }).join('');
  document.querySelector('.tile-bank').innerHTML = curTiles.map(t=>`<div class="tile ${t.used?'used':''}" onclick="pickTile(${t.id})">${t.c}</div>`).join('');
}
function checkBlankTiles(){
  const fb = document.getElementById('blankFeedback');
  if(curFilled.some(f=>f===null)){ fb.textContent='빈칸을 모두 채워주세요!'; fb.className='feedback bad'; return; }
  blankTotal++;
  const built = curAnswer.split('').map((c,i)=>{
    const slot = curBlankPositions.indexOf(i);
    return slot>-1 ? curFilled[slot] : c;
  }).join('');
  if(built.toLowerCase() === curAnswer.toLowerCase()){
    blankScore++;
    fb.textContent = '정답이에요! 🙌';
    fb.className='feedback good';
  } else {
    fb.textContent = `아쉬워요! 정답은 "${curAnswer}" 입니다.`;
    fb.className='feedback bad';
  }
  setTimeout(()=>{ blankIdx++; document.getElementById('blankArea').dataset.builtFor=''; renderBlank(); }, 1100);
}

/* ============ 짝 맞추기 (카드 뒤집기) ============ */
let matchCards=[], flippedIdx=[], matchedCount=0, matchLock=false;
function buildMatchDeck(){
  const pairCount = Math.min(6, words.length);
  const pick = shuffleArr(words).slice(0,pairCount);
  let deck=[];
  pick.forEach((w,i)=>{ deck.push({key:i, text:w.word}); deck.push({key:i, text:w.meaning}); });
  return shuffleArr(deck);
}
function renderMatch(){
  const area = document.getElementById('matchArea');
  if(words.length<2){ area.innerHTML='<div class="card"><div class="empty">짝 맞추기는 단어가 최소 2개 이상 필요해요 📝</div></div>'; return; }
  matchCards = buildMatchDeck(); flippedIdx=[]; matchedCount=0; matchLock=false;
  area.innerHTML = `
    <div class="score-badge"><span>짝 맞춘 개수</span><span><b id="matchScore">0</b> / ${matchCards.length/2}</span></div>
    <div class="grid" id="matchGrid" style="margin-top:12px;"></div>
    <button class="btn-line" style="width:100%; margin-top:14px; padding:11px;" onclick="renderMatch()">새 게임 🔀</button>
  `;
  const grid = document.getElementById('matchGrid');
  matchCards.forEach((c,i)=>{
    const el = document.createElement('div');
    el.className='mcard hidden-face'; el.dataset.idx=i;
    el.onclick=()=>flipCard(i, el);
    grid.appendChild(el);
  });
}
function flipCard(i, el){
  if(matchLock || el.classList.contains('matched') || flippedIdx.includes(i)) return;
  el.classList.remove('hidden-face'); el.textContent = matchCards[i].text; flippedIdx.push(i);
  if(flippedIdx.length===2){
    matchLock=true;
    const [a,b]=flippedIdx;
    const cardA = document.querySelector(`.mcard[data-idx='${a}']`), cardB = document.querySelector(`.mcard[data-idx='${b}']`);
    if(matchCards[a].key===matchCards[b].key){
      setTimeout(()=>{
        cardA.classList.add('matched'); cardB.classList.add('matched');
        matchedCount++; document.getElementById('matchScore').textContent=matchedCount;
        flippedIdx=[]; matchLock=false;
        if(matchedCount===matchCards.length/2) setTimeout(()=>alert('🎉 모든 카드를 맞췄어요!'), 200);
      }, 450);
    } else {
      cardA.classList.add('wrong'); cardB.classList.add('wrong');
      setTimeout(()=>{
        cardA.classList.add('hidden-face'); cardA.textContent='';
        cardB.classList.add('hidden-face'); cardB.textContent='';
        cardA.classList.remove('wrong'); cardB.classList.remove('wrong');
        flippedIdx=[]; matchLock=false;
      }, 750);
    }
  }
}

/* ============ 다크/라이트 모드 ============ */
function applyTheme(mode){
  document.documentElement.classList.remove('dark');
  let effective = mode;
  if(mode==='system'){
    effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  if(effective==='dark') document.documentElement.classList.add('dark');
  document.querySelectorAll('.theme-toggle .t-opt').forEach(o=>o.classList.toggle('active', o.dataset.theme===mode));
}
let themeMode = localStorage.getItem('sfl_theme') || 'system';
applyTheme(themeMode);
document.querySelectorAll('.theme-toggle .t-opt').forEach(o=>{
  o.addEventListener('click', ()=>{
    themeMode = o.dataset.theme;
    localStorage.setItem('sfl_theme', themeMode);
    applyTheme(themeMode);
  });
});
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(themeMode==='system') applyTheme('system');
  });
}

/* ============ 이스터에그: 타이틀 연속 탭 ============ */
let titleTapCount = 0, titleTapTimer = null;
function handleTitleTap(){
  titleTapCount++;
  clearTimeout(titleTapTimer);
  titleTapTimer = setTimeout(()=>{ titleTapCount = 0; }, 3000);
  if(titleTapCount>=5){
    titleTapCount = 0;
    clearTimeout(titleTapTimer);
    showEggToast();
  }
}
function spawnConfetti(){
  const colors = ['#3b5bfd','#7c5cff','#ff6b5e','#37c58a','#ffc84a'];
  for(let i=0;i<24;i++){
    const p = document.createElement('div');
    const size = 6 + Math.random()*6;
    p.style.position = 'fixed';
    p.style.left = '50%';
    p.style.bottom = '150px';
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.background = colors[i % colors.length];
    p.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    p.style.zIndex = 998;
    p.style.pointerEvents = 'none';
    p.style.opacity = '1';
    p.style.transition = 'transform 1.1s cubic-bezier(.16,1,.3,1), opacity 1.1s ease-out';
    document.body.appendChild(p);
    const angle = (Math.random()*Math.PI) + Math.PI;
    const dist = 60 + Math.random()*140;
    const dx = Math.cos(angle)*dist;
    const dy = -(80 + Math.random()*160);
    const rot = (Math.random()*720-360)+'deg';
    requestAnimationFrame(()=>{
      p.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot})`;
      p.style.opacity = '0';
    });
    setTimeout(()=> p.remove(), 1200);
  }
}
function showEggToast(){
  const toast = document.getElementById('eggToast');
  spawnConfetti();
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0) scale(1.06)';
  setTimeout(()=>{
    toast.style.transform = 'translateX(-50%) translateY(0) scale(1)';
  }, 220);
  setTimeout(()=>{
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(20px) scale(.85)';
  }, 2600);
}

renderWordList();
